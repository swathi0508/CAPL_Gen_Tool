[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capl_gen"
version = "0.0.1"
description = "CAPL Generation Tool for CAN and SOME/IP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cantools==40.1.0",
    "jinja2==3.1.5",
    "pandas==2.2.3",
    "lxml==5.3.0",
    "pywin32==308; sys_platform == 'win32'",
    "openpyxl==3.1.5",
    "Pillow==10.3.0"
]

# Optional dependencies for development
[project.optional-dependencies]
dev = [
    "ruff==0.9.0",
    "pytest==8.3.0",
    "pyinstaller==6.4.0"
]

# THIS IS MAGIC: It creates a terminal command called `capl-gen`
[project.scripts]
capl-gen = "capl_gen.__main__:main"

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "N"]
ignore = ["D203"]

[tool.ruff.lint.mccabe]
max-complexity = 10
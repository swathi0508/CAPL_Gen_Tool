[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capl_bolt"
version = "2.0.0"
description = "Instant Interface Test Script Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2==3.1.5",
    "pandas==2.2.3",
    "lxml==5.3.0",
    "pywin32==308; sys_platform == 'win32'",
    "openpyxl==3.1.5",
    "Pillow>=10.4.0, <12.0.0",
    "PyQt6>=6.6.1"
]

# Optional dependencies for development
[project.optional-dependencies]
dev = [
    "ruff==0.9.0",
    "pytest==8.3.0",
    "pyinstaller==6.20.0"
]

# THIS IS MAGIC: It creates a terminal command called `capl-bolt`
[project.scripts]
capl-bolt = "capl_bolt.__main__:main"

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "N"]
ignore = ["D203"]

[tool.ruff.lint.mccabe]
max-complexity = 10